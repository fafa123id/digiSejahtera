services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: digisejahtera_app

    working_dir: /var/www/digisejahtera

    volumes:
      - .:/var/www/digisejahtera
      - vendor:/var/www/digisejahtera/vendor

    ports:
      - "8000:8000"

    depends_on:
      - db

    command: >
      sh -c "
      [ -f .env ] || cp .env.example .env &&
      composer install &&
      php artisan key:generate --force || true &&
      until pg_isready -h db -p 5432 -U postgres; do
        echo 'Waiting for PostgreSQL...';
        sleep 2;
      done &&
      php artisan migrate --seed --force &&
      php artisan serve --host=0.0.0.0 --port=8000
      "

  vite:
    image: node:22-alpine

    container_name: digisejahtera_vite

    working_dir: /var/www/digisejahtera

    volumes:
      - .:/var/www/digisejahtera
      - node_modules:/var/www/digisejahtera/node_modules

    ports:
      - "5173:5173"

    command: >
      sh -c "
      npm install &&
      npm run dev -- --host
      "

  db:
    image: postgres:17-alpine

    container_name: digisejahtera_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: digisejahtera
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  vendor:
  node_modules:
  postgres_data: